[project]
name = "ente-local-runner"
version = "0.1.0"
description = "Kali AMD Python re-embedder — direct Supabase + Drive, SCRFD 500M + glintr100 250MB for max precision"
requires-python = ">=3.10"
dependencies = [
    "onnxruntime>=1.18",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "tqdm>=4.66",
    "supabase>=2.9",
    "google-auth>=2.28",
    "google-auth-oauthlib>=1.2",
    "requests>=2.32",
    "python-dotenv>=1.0",
]
# Optional but recommended for max-accuracy one-liner:
# pip install insightface  # wraps scrfd+glintr100 antelopev2 cleanly on CPU
# pip install -e .[insight]  (see optional-dependencies)

[project.optional-dependencies]
insight = ["insightface>=0.7.3"]

[project.scripts]
ente-run = "src.run:main"
ente-wipe = "src.wipe:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
